<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>You're offline — Classic Academy</title>
<style>
  body{font-family:system-ui,Segoe UI,Arial;background:#f4f8ff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#0f172a}
  .card{max-width:420px;text-align:center;padding:32px;background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(2,8,23,.12)}
  h1{font-size:1.3rem;margin:.6rem 0}
  p{color:#475569;line-height:1.6}
  button{margin-top:14px;padding:10px 18px;border-radius:999px;border:none;background:#0a6fbf;color:#fff;font-weight:800;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>This page hasn't been visited before, so it isn't available offline. Anything you've already saved offline
      will still sync automatically once your connection comes back.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
